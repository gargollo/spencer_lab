- date: "March 2026"
  title: "Can You Overdo Fiber? The Rise—and Risks—of Fibermaxxing"
  image: "/assets/images/news/Time.webp"
  link: "https://time.com/article/2026/03/25/what-fibermaxxing-gets-wrong-about-fiber/"
  body: >
    When a type of food or wellness trend becomes largely understood as  “healthy,” 
    many of us assume that more of it is always beneficial, without limit. This “more is 
    better” mentality spreads on social media, where the spectacle of “maxxing” out gets 
    clicks, while the old-school approach of strategic moderation gets scrolled right by. 

- date: "October 2026"
  title: "How does food change the microbiome and our overall health?"
  image: "/assets/images/news/HealthCompass.png"
  link: "https://med.stanford.edu/health-compass-podcast/microbiome-food.html"
  body: >
    Sean Spencer, MD, PhD, instructor of medicine, explores how he treats patients
    with challenging gastrointestinal issues, working with them to heal their gut 
    and improve their microbiome through a variety of tactics, including through 
    introducing variety of foods in small doses, adding more fiber and fermented 
    foods to their diet, and giving “gut shots” of brine from fermented foods.

